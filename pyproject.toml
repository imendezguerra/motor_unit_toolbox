[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "motor_unit_toolbox"
dynamic = ["version"]
description = "Analyse motor unit firing behaviour and action potentials from decomposed EMG"
authors = [
    {name = "Irene Mendez Guerra", email = "irene.mendez17@imperial.ac.uk"}
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = [
    "motor unit",
    "motor neuron",
    "MUAP",
    "EMG",
    "spike train",
    "decomposition",
    "MUAP tracking",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22",
    "scikit-learn>=1.0",
    "scipy>=1.8",
    "pandas>=1.4",
    "matplotlib>=3.5",
    "seaborn>=0.11",
    "networkx>=2.6",
    "easydict>=1.9"
]

[project.urls]
Homepage = "https://imendezguerra.github.io/motor_unit_toolbox/"
Documentation = "https://imendezguerra.github.io/motor_unit_toolbox/"
Source = "https://github.com/imendezguerra/motor_unit_toolbox"
Issues = "https://github.com/imendezguerra/motor_unit_toolbox/issues"
Changelog = "https://github.com/imendezguerra/motor_unit_toolbox/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "hypothesis>=6",
    "ruff>=0.6",
    "pre-commit>=3",
]
docs = [
    "mkdocs>=1.6,<2",  # MkDocs 2.0 removes the plugin system that mkdocstrings needs
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.setuptools.packages.find]
include = ["motor_unit_toolbox", "motor_unit_toolbox.*"]

[tool.setuptools.dynamic]
version = {attr = "motor_unit_toolbox.__version__"}

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
xfail_strict = true
markers = [
    "slow: tests that take more than a second or so (clustering, tracking)",
    "plot: matplotlib smoke tests",
]
filterwarnings = [
    "error",
    # Third-party deprecations we cannot act on
    "ignore::DeprecationWarning:seaborn.*",
    "ignore::DeprecationWarning:dateutil.*",
    # pyparsing>=3.3 deprecates camelCase names still used by matplotlib<3.10 (minimum-deps job)
    "ignore:.* deprecated - use .*:DeprecationWarning:matplotlib.*",
    # seaborn 0.11 compares versions with distutils LooseVersion (minimum-deps job)
    "ignore:distutils Version classes are deprecated:DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["motor_unit_toolbox"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_also = [
    "if __name__ == .__main__.:",
    "if flag_debug:",
    "if flag_plot:",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.egg-info"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "NPY",  # numpy-specific rules
    "PT",   # flake8-pytest-style
]
ignore = [
    "E501",   # line length is handled by the formatter
    "UP006",  # keep typing.List/Tuple style used across the package
    "UP007",  # keep Optional[...] / Union[...] style used across the package
    "UP035",  # same as above (deprecated typing imports)
    "UP045",  # same as above (Optional -> X | None)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]

[tool.ruff.lint.isort]
known-first-party = ["motor_unit_toolbox"]
